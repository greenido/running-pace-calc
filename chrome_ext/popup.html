<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>🏃🏽 Running Pace Calculator</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        height: 600px;
        width: 780px;
      }

      iframe {
        border: none;
        display: block;
        height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <!--
      app/ is produced by `npm run build:ext` from public/. Loading it locally
      means the popup opens instantly, works with no connection, and cannot be
      broken by the hosted site moving to a different URL.
    -->
    <iframe src="app/index.html" title="Running Pace Calculator"></iframe>
  </body>
</html>
